name: Feature Request
description: Propose a new feature or enhancement
title: "[FEATURE]: "

labels: ["enhancement"]

body:
  - type: dropdown
    id: request_type
    attributes:
      label: Request Type
      options:
        - New Feature
        - Enhancement to Existing Feature
    validations:
      required: true

  - type: textarea
    attributes:
      label: Problem Statement
      description: What problem are we trying to solve?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Proposed Solution
      description: Describe the expected solution.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Acceptance Criteria
      description: Define when this feature is considered complete.
      placeholder: |
        - [ ] Requirement 1
        - [ ] Requirement 2
    validations:
      required: true

  - type: textarea
    attributes:
      label: Additional Context
      description: Screenshots, references, or technical notes.
    validations:
      required: false
